# Supply-chain controls (pnpm v11+ defaults, made explicit so they survive
# future default changes and are visible to anyone reviewing the config).
#
# minimumReleaseAge: hold off on resolving newly published versions for the
# given number of minutes. 1440 = 1 day, the v11 default. Gives the community
# time to detect and yank compromised releases.
minimumReleaseAge: 1440

# blockExoticSubdeps: refuse transitive deps that come from git/file/http
# sources instead of the npm registry. Direct deps in package.json may still
# use exotic sources if explicitly declared.
blockExoticSubdeps: true

# strictDepBuilds: install scripts only run for packages explicitly listed
# in allowBuilds below. Anything else fails the install instead of warning.
strictDepBuilds: true

# verifyDepsBeforeRun: pnpm v11 defaults to "install", which makes every
# `pnpm exec` / `pnpm run` re-check node_modules against the lockfile and
# try to refresh if it looks stale. In multi-stage Docker builds this fires
# in the build stage (where node_modules was COPY'd from a previous stage)
# and aborts because there is no TTY to confirm the purge. We install with
# --frozen-lockfile, so the lockfile is the source of truth and this extra
# check has no value here.
verifyDepsBeforeRun: false

allowBuilds:
  "@prisma/engines": true
  # swagger-ui-dist's install-time telemetry; never run it.
  "@scarf/scarf": false
  # tsx (prisma/seed.ts) runs on esbuild, whose install script checks its
  # platform binary.
  esbuild: true
  msw: false
  prisma: true
  sharp: true
  unrs-resolver: true

# Security floors for transitive copies the direct ranges do not reach.
# sharp: 0.35.3 bundles a libheif with GHSA-rgj7-g3m4-5g8c, and next pins its
#   own copy; it decodes artwork fetched from the media servers.
# js-yaml: GHSA-2883-xcg3-v3hh, via graphile-worker > cosmiconfig.
# effect: GHSA-7589-6fvf-x4pw (ReDoS in Schema.TemplateLiteral), via prisma >
#   @prisma/config, which pins effect 3.20.0 exactly even in its latest release;
#   3.22 is a minor of the same 3.x line.
# minimatch: GHSA-g3hv-75wg-m249, via shadcn > ts-morph 26 > @ts-morph/common
#   0.27 (minimatch ^10); shadcn accepts only ts-morph ^26, and @ts-morph/common
#   0.29 moved to minimatch ^11 with the same minimatch() call.
overrides:
  sharp: ^0.35.4
  js-yaml: ^4.3.2
  "@prisma/config>effect": ^3.22.1
  "@ts-morph/common>minimatch": ^11.0.1
