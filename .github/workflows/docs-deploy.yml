name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs-deploy.yml"
      # The API reference is generated from the app's OpenAPI source at docs
      # build time, so a change to the API republishes the docs.
      - "scripts/generate-openapi.ts"
      - "src/lib/api-keys/openapi.ts"
      - "src/lib/api-keys/scopes.ts"
      - "src/lib/api-keys/limits.ts"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # swagger-ui-dist pulls in @scarf/scarf, whose install script reports the
      # install to a third party. The app's pnpm config refuses to run it; npm
      # (used for the docs) runs it unless told not to report.
      SCARF_ANALYTICS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build docs with Astro
        uses: withastro/action@v6
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
