name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs-deploy.yml"
      # The API reference is generated from the app's OpenAPI source at docs
      # build time, so a change to the API republishes the docs.
      - "scripts/generate-openapi.ts"
      - "src/lib/api-keys/openapi.ts"
      - "src/lib/api-keys/scopes.ts"
      - "src/lib/api-keys/limits.ts"
      - "package.json"
  # Every pull request builds the docs, whatever it touches. The build only
  # ran on a push to main, so a page that failed to compile (an MDX `<word>`
  # read as an unclosed JSX tag) reached main and stopped the site
  # deploying. No paths filter: the build also reads the OpenAPI and
  # rule-set registries under src/, and a filtered check that is skipped
  # never reports, so it could not be made a required check.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A deploy waits for the one before it; a pull request's build replaces its
# own earlier run and never queues behind a deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Starlight's `lastUpdated` reads each page's date from git; on
          # the default shallow clone every page gets the one fetched
          # commit's date.
          fetch-depth: 0

      - name: Build docs with Astro
        uses: withastro/action@v6
        with:
          path: ./docs

  deploy:
    needs: build
    # A pull request only checks that the site builds.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
